[tool.poetry]
name = "logger-tracker"
version = "1.0.13"
description = "Libreria estandar para manejo de logs estandar"
authors = ["damian27goa@gmail.com"]
readme = "README.md"
packages = [
    { include = "logger_tracker", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.13"
rich = "*"

# OpenTelemetry optional dependencies (install with extras 'otel')
opentelemetry-api = {version = "*", optional = true}
opentelemetry-sdk = {version = "*", optional = true}
opentelemetry-exporter-otlp = {version = "*", optional = true}
opentelemetry-instrumentation-flask = {version = "*", optional = true}
opentelemetry-instrumentation-requests = {version = "*", optional = true}
opentelemetry-instrumentation-sqlalchemy = {version = "*", optional = true}

[tool.poetry.group.dev.dependencies]
# Dependencias de desarrollo
pytest = "*"

[tool.poetry.extras]
otel = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-flask",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-sqlalchemy",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"